name: test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # ratchet:actions/checkout@v2
      - uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # ratchet:actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: nf-core/setup-nextflow@b9f764e8ba5c76b712ace14ecbfcef0e40ae2dd8 # ratchet:nf-core/setup-nextflow@v1
      - run: bash scripts/test.sh
